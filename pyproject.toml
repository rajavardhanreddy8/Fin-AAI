[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "indian-stock-research"
version = "0.3.0"
description = "Evidence-backed Indian public-equity research agent"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["pypdf==6.7.0"]

[project.optional-dependencies]
supabase = ["supabase==2.31.0"]
aws = ["boto3>=1.41,<2", "awscrt>=0.27,<1", "certifi>=2025.1.31"]

[project.scripts]
stock-research = "stock_research.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
